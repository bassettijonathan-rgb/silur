<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Silur — deep-time detective</title>
    <style>
      body { font: 13px system-ui, sans-serif; margin: 12px; background: #14161a; color: #dde; }
      canvas { background: #1c1f26; border: 1px solid #333; display: block; margin: 6px 0; }
      button, input, select { font: inherit; background: #232833; color: #dde; border: 1px solid #445; border-radius: 3px; padding: 2px 6px; }
      button { cursor: pointer; } button:disabled { opacity: .45; cursor: default; } button.sel { border-color: #ffec4d; }
      .top { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
      .main { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
      .dim { color: #89a; } .bad { color: #f88; } .budget { font-weight: 600; color: #ffec4d; }
      .bar { width: 160px; height: 8px; background: #232833; border-radius: 4px; overflow: hidden; }
      .bar div { height: 100%; width: 0; background: #4fa3e5; transition: width .15s; }
      .cores { display: inline-flex; gap: 4px; flex-wrap: wrap; }
      .legend span { margin-right: 10px; } .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 3px; }
      .tab.sel { border-color: #ffec4d; } .tabs { display: flex; gap: 4px; margin-bottom: 8px; }
      .scroll { overflow-x: auto; max-width: 900px; } .right { max-width: 900px; }
      table { border-collapse: collapse; margin: 6px 0; } th, td { text-align: left; padding: 1px 12px 1px 0; }
      .hyp { border: 1px solid #334; border-radius: 4px; padding: 6px; margin: 8px 0; } .hyp.rejected { opacity: .55; } .hyp.supported { border-color: #4a7; }
      textarea { background: #232833; color: #dde; border: 1px solid #445; border-radius: 3px; display: block; margin: 4px 0; font: inherit; }
      .log { max-height: 140px; overflow: auto; margin-top: 6px; color: #aab; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
